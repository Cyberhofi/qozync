services:
  qobuz-sync:
    build: .
    image: qobuz-sync:latest
    container_name: qobuz-sync
    # Run as a specific host user so downloaded files aren't root-owned and so
    # writes to a media library / NAS share succeed. Set PUID/PGID in .env to the
    # owner of your music + config folders (find it with `id <user>`). Defaults
    # to root (0:0), which matches the original behaviour.
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Persist this so encrypted secrets survive re-creation. Generate with:
      #   openssl rand -base64 32 | tr '+/' '-_'
      # If unset, a key is generated into the config volume on first run.
      - SECRET_KEY=${SECRET_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      # Override the host paths in .env (CONFIG_DIR / MUSIC_DIR) to point at real
      # disks, e.g. MUSIC_DIR=/srv/media/music. Both must be writable by PUID/PGID.
      - ${CONFIG_DIR:-./config}:/config    # SQLite DB + encryption key
      - ${MUSIC_DIR:-./music}:/music       # downloaded, tagged audio
    restart: unless-stopped
