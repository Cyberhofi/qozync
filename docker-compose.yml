services:
  qobuz-sync:
    build: .
    image: qobuz-sync:latest
    container_name: qobuz-sync
    ports:
      - "8080:8080"
    environment:
      # Persist this so encrypted secrets survive re-creation. Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # If unset, a key is generated into the config volume on first run.
      - SECRET_KEY=${SECRET_KEY:-}
      - TZ=${TZ:-UTC}
    volumes:
      - ./config:/config    # SQLite DB + encryption key
      - ./music:/music      # downloaded, tagged audio
    restart: unless-stopped
