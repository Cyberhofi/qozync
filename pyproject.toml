[project]
name = "qobuz-sync"
version = "0.1.0"
description = "Background service that auto-downloads your Qobuz purchases, with a web UI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "mutagen>=1.47",
    "cryptography>=42.0",
    # Bandcamp fingerprints TLS; curl_cffi impersonates a real browser to avoid
    # being blocked (bundles its own patched libcurl in the wheel).
    # Pinned <0.17: curl_cffi 0.17.0 regressed cookie attachment — cookies set on
    # the session are not sent, so Bandcamp returns an (unauthenticated) HTML page.
    "curl_cffi>=0.16,<0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
